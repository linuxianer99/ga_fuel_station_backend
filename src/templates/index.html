<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MLV Tankstelle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="main.js"></script>
</head>
  <body>
    <div class="container-fluid">
	    <div class="row">
		    <div class="col">
			    <h3>
				    MLV Tankstelle
			    </h3>
		    </div>
	    </div>
    <form class="needs-validation" novalidate action="{{ url_for('submit_refueling') }}" method="post">
        <div class="form-group">
            <label for="aircraft" class="form-label">Aircraft Callsign</label>
                {% if aircraft %}
                <input type="text" class="form-control" name="aircraft" id="aircraft" value="{{ aircraft }}" readonly/>
                {% else %}
                <input type="text" class="form-control" name="aircraft" id="aircraft" pattern="^[A-Z]-[A-Z]{4}|[A-Z]{2}-[A-Z]{3}|N[0-9]{1,5}[A-Z]{0,2}$" required/>
                {% endif %}
                <div class="invalid-feedback">format like D-MLVT</div>
        </div>  
        <div class="form-group">
            <label for="sort">Fuel Sort</label>
            {% if sort %}
            <input type="text" class="form-control" name="sort" id="sort" value="{{ sort }}" readonly/>
            {% else %}
            <select class="form-control" name="sort" id="sort" required>
                <option>Fuel Sort</option>
                {% for article in articles %}
                <option value="{{ article }}">{{ article }}</option>
                {% endfor %}
            </select>
            {% endif %}
        </div>
        <div class="form-group">
            <label for="amount">Amount</label>
	        <input type="text" class="form-control" name="amount" id="amount" placeholder="Amount of fuel" required/>
		    </div>
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="print_recipe" name="print_recipe">
        <label class="form-check-label" for="print_recipe">Print recipe</label>
      </div> 
        <button type="submit" class="btn btn-primary">Submit</button>
	</form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

<script type="text/javascript">
    // Example starter JavaScript for disabling form submissions if there are invalid fields
    (() => {
      'use strict';

      // Fetch all the forms we want to apply custom Bootstrap validation styles to
      const forms = document.querySelectorAll('.needs-validation');

      // Loop over them and prevent submission
      Array.from(forms).forEach((form) => {
        form.addEventListener(
          'submit',
          (event) => {
            if (!form.checkValidity()) {
              event.preventDefault();
              event.stopPropagation();
            }

            form.classList.add('was-validated');
          },
          false
        );
      });
    })();
  </script>
</body>
</html>
